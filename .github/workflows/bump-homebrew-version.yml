name: Bump Homebrew version

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bump and push patch version
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            version="$(ruby <<'RUBY'
            path = "Formula/lazymcp.rb"
            content = File.read(path)
            match = content.match(/^(\s*version\s+")(\d+)\.(\d+)\.(\d+)(")$/)
            abort "Could not find semantic version in #{path}" unless match

            new_version = [
              match[2].to_i,
              match[3].to_i,
              match[4].to_i + 1,
            ].join(".")

            updated = content.sub(match[0], "#{match[1]}#{new_version}#{match[5]}")
            File.write(path, updated)
            puts new_version
          RUBY
            )"

            git add Formula/lazymcp.rb
            git commit -m "Bump Homebrew formula version to ${version}"
            if git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push failed on attempt ${attempt}; retrying from the latest main" >&2
            sleep $((attempt * 2))
          done

          exit 1
